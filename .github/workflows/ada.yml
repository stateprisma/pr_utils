name: Ada (GNAT)

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Alire toolchain
    - uses: alire-project/setup-alire@v4

    - name: Build
      run: alr build --validation
